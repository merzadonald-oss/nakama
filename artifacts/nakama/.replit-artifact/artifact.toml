kind = "mobile"
previewPath = "/"
title = "Nakama"
version = "1.0.0"
id = "artifacts/nakama"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 21215

[services.development]
run = "pnpm --filter @workspace/nakama run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nakama", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/nakama", "run", "serve" ]

[services.env]
PORT = "21215"
BASE_PATH = "/"
